title: "[Idea] "
labels: ["needs-review", "architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape TitleChain Foundation standards. Early ideas are welcome; you do not need to write an RFC first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the current limitation, risk, or unmet need.
      placeholder: Explain the problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who is affected?
      description: Identify the people, communities, implementers, or jurisdictions involved.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of ICSN does this relate to?
      multiple: true
      options:
        - Identity
        - Authority
        - Data
        - Agent
        - Compute
        - Wallet
        - Registry
        - Credential
        - Jurisdiction
        - Evidence
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: Describe the concept, desired outcome, and any important constraints.
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Existing standards or open-source work
      description: Link standards, specifications, research, or projects the Foundation should examine.
  - type: textarea
    id: evidence
    attributes:
      label: Implementation or test evidence
      description: Share any prototype, deployment, test result, or other evidence already available.
  - type: checkboxes
    id: contribution
    attributes:
      label: How would you like to help?
      options:
        - label: Architecture
        - label: Engineering
        - label: Security
        - label: Documentation
        - label: Legal or policy
        - label: Research
        - label: Testing
        - label: Other
