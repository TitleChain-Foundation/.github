title: "[Implementation] "
labels: ["implementation", "conformance", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report implementation experience and conformance evidence. Never include credentials, private member data, or production secrets.
  - type: input
    id: implementation
    attributes:
      label: Implementation or project
      description: Name and link the implementation when it is public.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Standards area
      multiple: true
      options:
        - Identity
        - Authority
        - Data
        - Agents
        - Credentials
        - Registry
        - Evidence
        - Privacy or security
        - Interoperability
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Identify the specification version, implementation version, platform, and relevant dependencies.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding or observed behavior
      description: Explain what worked, failed, differed, or remained ambiguous.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps or test method
      description: Provide the smallest safe reproducible example or test procedure.
  - type: textarea
    id: evidence
    attributes:
      label: Conformance evidence
      description: Link test output, traces, schemas, or other non-sensitive evidence.
  - type: checkboxes
    id: participate
    attributes:
      label: Follow-up
      options:
        - label: I can help test a proposed resolution.
        - label: I can contribute implementation guidance or a pull request.
        - label: This finding may require security review.
