title: "[Contributor Q&A] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome. Tell us enough to help you find the right public pathway.

        Do not post credentials, private participant data, wallet or financial information, confidential business material, production secrets, or unreported security vulnerabilities.
  - type: textarea
    id: introduction
    attributes:
      label: Who are you?
      description: Share only the public context that will help us understand your interests.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What can you help with?
      description: Skills may include technology, economics, statistics, privacy, law, accounting, design, accessibility, education, security, governance, business, or human behavior.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What are you trying to understand?
      description: Ask one focused question or describe the decision you are trying to make.
    validations:
      required: true
  - type: dropdown
    id: ecosystem-area
    attributes:
      label: Which part of the ecosystem?
      multiple: true
      options:
        - TitleChain Foundation
        - ICSN public standards
        - Power of Her Purse / First Activation / 100K Women
        - M5POD demo or activation
        - Contributing to an open Issue
        - Sponsorship or engineering support
        - IAM or M5Member distinction
        - Not sure yet
    validations:
      required: true
