title: "[Question or feedback] "
labels: ["question", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Ask a focused question or review the public demo and onboarding. Do not post private identity, account, wallet, business, or security information.
  - type: dropdown
    id: purpose
    attributes:
      label: What are you here to do?
      options:
        - Review the demo or onboarding experience
        - Ask a standards or governance question
        - Ask how to contribute
        - Report a public documentation problem
        - Other public feedback
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What did you observe or want to ask?
      placeholder: Name the page or step and describe one clear question or observation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this concern?
      multiple: true
      options:
        - Identity
        - Authority
        - Data
        - Agents
        - Credentials
        - Registry
        - Evidence
        - Privacy or security
        - Governance
        - Conformance
        - Demo or onboarding
        - Accessibility or usability
        - Contribution process
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain what you are trying to do and include relevant links or specification sections.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What would you recommend?
      description: Suggest one concrete improvement, next step, or source to review.
