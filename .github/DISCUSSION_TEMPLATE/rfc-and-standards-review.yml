title: "[RFC Review] "
labels: ["standard", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Provide focused, evidence-backed review of a proposed ICSN standard. One major concern per discussion is preferred.
  - type: input
    id: rfc
    attributes:
      label: RFC or standards proposal
      description: Provide the identifier and a link to the exact version under review.
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or requirement
      description: Identify the clause, schema element, or decision your feedback concerns.
  - type: dropdown
    id: review-type
    attributes:
      label: Type of review
      multiple: true
      options:
        - Normative correctness
        - Identity or authority
        - Privacy or security
        - Interoperability
        - Implementation feasibility
        - Conformance and testing
        - Legal or policy
        - Editorial clarity
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: Review analysis
      description: Explain the issue, impact, and reasoning.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Suggest replacement text, schema changes, or a concrete resolution when possible.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link standards, research, implementation results, threat models, or conformance tests.
  - type: checkboxes
    id: independence
    attributes:
      label: Review declaration
      options:
        - label: I have disclosed any material implementation, commercial, or organizational interest relevant to this review.
          required: true
