<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">People's Trust Public Conformance Pilot</title>
  <desc id="desc">A brand-aligned editorial card with abstract agricultural and water scenes introduces an anonymous synthetic pilot and its repeatable public-review pipeline.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a965"/>
      <stop offset="1" stop-color="#43552f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667f94"/>
      <stop offset="1" stop-color="#2f4d55"/>
    </linearGradient>
    <clipPath id="topLeft"><rect x="50" y="50" width="520" height="300"/></clipPath>
    <clipPath id="topRight"><rect x="580" y="50" width="570" height="145"/></clipPath>
    <clipPath id="bottomRight"><rect x="580" y="205" width="570" height="145"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="#f7f4ee"/>
  <rect x="50" y="50" width="1100" height="800" fill="#fffdf9" stroke="#d8d0c2" stroke-width="2"/>

  <g clip-path="url(#topLeft)">
    <rect x="50" y="50" width="520" height="300" fill="url(#field)"/>
    <path d="M-20 370 L215 25 L245 25 L35 370 Z M85 370 L295 25 L325 25 L140 370 Z M200 370 L380 25 L410 25 L255 370 Z M330 370 L470 25 L500 25 L385 370 Z M470 370 L555 25 L585 25 L525 370 Z" fill="#c2cf75" opacity=".78"/>
    <path d="M20 370 L235 25 M130 370 L315 25 M250 370 L400 25 M380 370 L485 25 M515 370 L565 25" stroke="#e1d48c" stroke-width="8" opacity=".55"/>
  </g>
  <g clip-path="url(#topRight)">
    <rect x="580" y="50" width="570" height="145" fill="#89985b"/>
    <path d="M560 105 C720 15 805 190 950 100 C1050 35 1110 52 1170 20 V205 H560 Z" fill="url(#water)"/>
    <path d="M560 145 C710 70 810 220 970 125 C1070 65 1130 80 1170 48" fill="none" stroke="#b9cbaa" stroke-width="12" opacity=".7"/>
  </g>
  <g clip-path="url(#bottomRight)">
    <rect x="580" y="205" width="570" height="145" fill="#8ea36c"/>
    <path d="M580 320 C680 235 785 325 875 250 C955 185 1060 275 1150 215 V365 H580 Z" fill="#4f693f"/>
    <path d="M580 345 C720 260 820 355 945 280 C1035 225 1100 265 1150 245" fill="none" stroke="#6b8292" stroke-width="20"/>
  </g>

  <rect x="85" y="78" width="240" height="48" rx="6" fill="#fffdf9"/>
  <text x="205" y="109" text-anchor="middle" fill="#9c7b26" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">PUBLIC PILOT</text>

  <text x="95" y="440" fill="#211627" font-family="Georgia, 'Times New Roman', serif" font-size="58">One pilot. Then prove</text>
  <text x="95" y="505" fill="#211627" font-family="Georgia, 'Times New Roman', serif" font-size="58">the framework repeats.</text>
  <line x1="95" y1="535" x2="255" y2="535" stroke="#d53679" stroke-width="4"/>

  <text x="95" y="585" fill="#4c4650" font-family="Arial, sans-serif" font-size="20">PILOT 001</text>
  <text x="320" y="585" fill="#211627" font-family="Arial, sans-serif" font-size="23" font-weight="700">████████ - complete synthetic framework</text>
  <line x1="95" y1="605" x2="1105" y2="605" stroke="#ded8cf"/>

  <text x="95" y="645" fill="#4c4650" font-family="Arial, sans-serif" font-size="20">PILOT 002</text>
  <text x="320" y="645" fill="#211627" font-family="Arial, sans-serif" font-size="23" font-weight="700">████████ - independent replication</text>
  <line x1="95" y1="665" x2="1105" y2="665" stroke="#ded8cf"/>

  <text x="95" y="705" fill="#4c4650" font-family="Arial, sans-serif" font-size="20">PILOT 003+</text>
  <text x="320" y="705" fill="#211627" font-family="Arial, sans-serif" font-size="23" font-weight="700">████████ - national scale without consolidation</text>

  <text x="95" y="765" fill="#7c2c62" font-family="Arial, sans-serif" font-size="24" font-weight="700">Title. Stewardship. Local operations. M4 analysis. Public evidence.</text>
  <rect x="95" y="792" width="1010" height="42" rx="7" fill="#c7a552"/>
  <text x="600" y="819" text-anchor="middle" fill="#211627" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1">SYNTHETIC PUBLIC REVIEW - NOT AN ACQUISITION OR OFFERING</text>
</svg>
